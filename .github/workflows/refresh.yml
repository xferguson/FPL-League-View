name: Refresh FPL data

on:
  schedule:
    # Once a day, and again through Monday/Tuesday when bonus points settle and
    # the gameweek is finally marked data-checked.
    - cron: '0 6 * * *'
    - cron: '0 12,18 * * 1,2'
  workflow_dispatch:

# Permissions are declared per job, not here: a top-level block sets every
# unlisted permission to none, and the publish job below cannot then grant
# itself the pages/id-token scopes the deploy needs.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch from the FPL API
        run: node scripts/fetch-data.mjs

      - name: Validate what was fetched
        run: node scripts/validate-data.mjs

      - name: Commit if anything moved
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No change in the data — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh FPL data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
